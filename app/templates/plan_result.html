{% extends 'base.html' %}
{% block title %}Your Plan – RepTrack{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 fade-up">
    <div>
        <h1 class="page-heading mb-0">Your Fitness Plan</h1>
        <p class="page-subheading mt-1">
            Generated on {{ plan.created_at.strftime('%B %d, %Y') }}
        </p>
    </div>
    <div class="d-flex gap-2">
        <button onclick="openAndPrint()" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-file-pdf me-1"></i>Save as PDF
        </button>
        <a href="{{ url_for('main.generate_plan') }}?regenerate=1" 
           class="btn btn-primary btn-sm">
            <i class="bi bi-arrow-repeat me-1"></i>Regenerate
        </a>
    </div>
</div>

<div class="card p-0 overflow-hidden fade-up">
    <iframe id="planFrame" style="width:100%; border:none; min-height:600px;"></iframe>
</div>

<script>
    const html = {{ plan.html | tojson }};
    const iframe = document.getElementById('planFrame');
    iframe.srcdoc = html;
    iframe.onload = function() {
        iframe.style.height = iframe.contentDocument.body.scrollHeight + 40 + 'px';
    };
    
    function openAndPrint() {
        const iframe = document.getElementById('planFrame')
        const html = iframe.srcdoc
        const newTab = window.open('', '_blank')
        newTab.document.write(html)
        newTab.document.close()
        newTab.focus()
        setTimeout(() => newTab.print(), 500)
    }
</script>
{% endblock %}
